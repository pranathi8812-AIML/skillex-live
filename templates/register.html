{% extends 'base.html' %}
{% block content %}
<div class="glass-card" style="max-width: 400px; margin: 50px auto; text-align: center;">
    <h2 style="margin-bottom: 20px;">Create an Account</h2>
    
    <!-- This block displays the "Email already registered" error -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div style="padding: 10px; margin-bottom: 15px; border-radius: 5px; background-color: {% if category == 'warning' %}#f59e0b{% else %}#3b82f6{% endif %}; color: white; font-size: 0.9rem;">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group" style="text-align: left;">
            <label>Full Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="form-group" style="text-align: left;">
            <label>Email Address</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="form-group" style="text-align: left;">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="form-group" style="text-align: left;">
            <label>Location / Ward</label>
            <input type="text" name="ward" class="form-control" required>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px; background: var(--accent-purple); border: none;">Register</button>
    </form>
    
    <p style="margin-top: 20px; color: var(--text-muted); font-size: 0.9rem;">
        Already have an account? <a href="{{ url_for('login') }}" style="color: var(--accent-purple); text-decoration: none;">Login here</a>
    </p>
</div>
{% endblock %}
